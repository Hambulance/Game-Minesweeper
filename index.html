<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مین روب 💣</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            direction: rtl;
            font-family: 'Lalezar', cursive;
            background: url('images/image.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Dark overlay */
            z-index: -1;
        }

        h1 {
            margin: 0;
            text-align: center;
            background: #2196F3;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 2em;
            margin-bottom: 30px;
        }

        #game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 0 auto;
        }

        #board {
            display: grid;
            gap: 2px;
            background-color: #404040;
            padding: 2px;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
            margin: 0 auto;
        }

        .cell {
            width: 35px;
            height: 35px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
            color: #333;
            font-size: 1.1em;
        }

        .cell:hover {
            background: linear-gradient(145deg, #f0f0f0, #e6e6e6);
            transform: scale(1.05);
            z-index: 1;
        }

        .revealed {
            background: linear-gradient(145deg, #e0e0e0, #d5d5d5);
        }

        .mine {
            background: linear-gradient(145deg, #2196F3, #1976D2);
            color: white;
        }

        @keyframes explode {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #controls {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #mines-count {
            font-family: 'Lalezar', cursive;
            font-size: 1.2em;
            font-weight: bold;
            color: #64B5F6;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        button#reset {
            background: linear-gradient(145deg, #2196F3, #1976D2);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button#reset:hover {
            background: linear-gradient(145deg, #1976D2, #2196F3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button#reset:active {
            transform: translateY(1px);
        }

        .number-1 { color: #2196F3; }
        .number-2 { color: #666666; }
        .number-3 { color: #1976D2; }
        .number-4 { color: #0D47A1; }
        .number-5 { color: #666666; }
        .number-6 { color: #2196F3; }
        .number-7 { color: #0D47A1; }
        .number-8 { color: #263238; }

        #game-selection {
            text-align: center;
            margin-bottom: 30px;
        }

        #game-selection h2 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 0 auto;
            max-width: 400px;
        }

        .grid-option {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .grid-option:hover {
            background: rgba(0, 0, 0, 0.6);
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .grid-option .size {
            font-size: 1.3em;
            font-weight: bold;
            color: #64B5F6;
            margin-left: auto;
        }

        .grid-option .mines {
            color: white;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0 15px;
        }

        .grid-option .difficulty {
            font-size: 1em;
            color: #E0E0E0;
            margin-right: auto;
        }

        #controls, #game-container {
            display: none;
        }

        /* Add these classes for showing/hiding elements */
        .show {
            display: flex !important;
        }

        .hide {
            display: none !important;
        }

        footer {
            margin-top: 40px;
            margin-bottom: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            backdrop-filter: none;
            box-shadow: none;
        }

        /* Add Vazirmatn font for Farsi text */
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');

        /* Update button styles to use Lalezar */
        button, .grid-option {
            font-family: 'Lalezar', cursive;
        }

        /* Style for the back button */
        #back-button {
            padding: 8px 16px;
            background: linear-gradient(145deg, #90A4AE, #78909C);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Lalezar', cursive;
            font-size: 1em;
            transition: all 0.3s ease;
            margin-right: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #back-button:hover {
            background: linear-gradient(145deg, #78909C, #90A4AE);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        #back-button:active {
            transform: translateY(1px);
        }

        /* Add these new styles */
        .main-container {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            margin: 20px auto;
            max-width: 90%;
            width: fit-content;
            min-width: 500px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>مین روب 💣</h1>
        <div id="game-selection" class="game-selection">
            <h2>سایز بازی را انتخاب کنید 🎮</h2>
            <div class="grid-options">
                <button class="grid-option" data-size="10" data-mines="10">
                    <span class="size">۱۰ در ۱۰</span>
                    <span class="mines">۱۰ مین 💣</span>
                    <span class="difficulty">آسان 😊</span>
                </button>
                <button class="grid-option" data-size="16" data-mines="40">
                    <span class="size">۱۶ در ۱۶</span>
                    <span class="mines">۴۰ مین 💣</span>
                    <span class="difficulty">متوسط 🤔</span>
                </button>
                <button class="grid-option" data-size="20" data-mines="80">
                    <span class="size">۲۰ در ۲۰</span>
                    <span class="mines">۸۰ مین 💣</span>
                    <span class="difficulty">سخت 😰</span>
                </button>
                <button class="grid-option" data-size="30" data-mines="180">
                    <span class="size">۳۰ در ۳۰</span>
                    <span class="mines">۱۸۰ مین 💣</span>
                    <span class="difficulty">خیلی سخت 🤯</span>
                </button>
            </div>
        </div>
        <div id="controls">
            <button id="back-button">بازگشت 🔙</button>
            <span>مین های باقی مانده: <span id="mines-count">۴۰</span> 💣</span>
            <button id="reset">بازی جدید 🔄</button>
        </div>
        <div id="game-container">
            <div id="board"></div>
        </div>

        <footer>
            <p>Copyright © Dr. Mythic Productions. All Rights Reserved</p>
        </footer>
    </div>

    <script>
        let BOARD_WIDTH = 16;
        let BOARD_HEIGHT = 16;
        let MINE_COUNT = 40;

        let board = [];
        let gameOver = false;
        let minesLeft = MINE_COUNT;

        function toFarsiNumber(n) {
            const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return n.toString().replace(/\d/g, x => farsiDigits[x]);
        }

        function initializeGameSelection() {
            const gameSelection = document.getElementById('game-selection');
            const controls = document.getElementById('controls');
            const gameContainer = document.getElementById('game-container');
            
            document.querySelectorAll('.grid-option').forEach(button => {
                button.addEventListener('click', () => {
                    const size = parseInt(button.dataset.size);
                    const mines = parseInt(button.dataset.mines);
                    
                    BOARD_WIDTH = size;
                    BOARD_HEIGHT = size;
                    MINE_COUNT = mines;
                    minesLeft = MINE_COUNT;
                    
                    // Hide selection screen and show game
                    gameSelection.classList.add('hide');
                    controls.classList.add('show');
                    gameContainer.classList.add('show');
                    
                    // Start new game
                    initGame();
                });
            });
        }

        function createBoard() {
            // Initialize empty board
            board = Array(BOARD_HEIGHT).fill().map(() => 
                Array(BOARD_WIDTH).fill().map(() => ({
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    neighborMines: 0
                }))
            );

            // Place mines
            let minesPlaced = 0;
            while (minesPlaced < MINE_COUNT) {
                const x = Math.floor(Math.random() * BOARD_WIDTH);
                const y = Math.floor(Math.random() * BOARD_HEIGHT);
                
                if (!board[y][x].isMine) {
                    board[y][x].isMine = true;
                    minesPlaced++;
                }
            }

            // Calculate neighbor mines
            for (let y = 0; y < BOARD_HEIGHT; y++) {
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    if (!board[y][x].isMine) {
                        let count = 0;
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                const ny = y + dy;
                                const nx = x + dx;
                                if (ny >= 0 && ny < BOARD_HEIGHT && nx >= 0 && nx < BOARD_WIDTH && board[ny][nx].isMine) {
                                    count++;
                                }
                            }
                        }
                        board[y][x].neighborMines = count;
                    }
                }
            }
        }

        function revealCell(x, y) {
            if (!board[y][x].isRevealed && !board[y][x].isFlagged) {
                board[y][x].isRevealed = true;

                if (board[y][x].neighborMines === 0 && !board[y][x].isMine) {
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            const ny = y + dy;
                            const nx = x + dx;
                            if (ny >= 0 && ny < BOARD_HEIGHT && nx >= 0 && nx < BOARD_WIDTH) {
                                revealCell(nx, ny);
                            }
                        }
                    }
                }
            }
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            for (let y = 0; y < BOARD_HEIGHT; y++) {
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    const cell = board[y][x];
                    const cellElement = document.createElement('button');
                    cellElement.className = 'cell';
                    
                    if (cell.isRevealed) {
                        cellElement.classList.add('revealed');
                        if (cell.isMine) {
                            cellElement.classList.add('mine');
                            cellElement.textContent = '💣';
                        } else if (cell.neighborMines > 0) {
                            cellElement.textContent = toFarsiNumber(cell.neighborMines);
                            cellElement.classList.add(`number-${cell.neighborMines}`);
                        }
                    } else if (cell.isFlagged) {
                        cellElement.textContent = '🚩';
                    }

                    cellElement.addEventListener('click', () => handleCellClick(x, y));
                    cellElement.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(x, y);
                    });

                    boardElement.appendChild(cellElement);
                }
            }
        }

        function handleCellClick(x, y) {
            if (gameOver || board[y][x].isFlagged) return;

            if (board[y][x].isMine) {
                gameOver = true;
                revealAllMines();
                alert('بازی تمام شد! 💥');
            } else {
                revealCell(x, y);
            }
            renderBoard();
        }

        function handleRightClick(x, y) {
            if (gameOver || board[y][x].isRevealed) return;

            board[y][x].isFlagged = !board[y][x].isFlagged;
            minesLeft += board[y][x].isFlagged ? -1 : 1;
            document.getElementById('mines-count').textContent = toFarsiNumber(minesLeft);
            renderBoard();
        }

        function revealAllMines() {
            for (let y = 0; y < BOARD_HEIGHT; y++) {
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    if (board[y][x].isMine) {
                        board[y][x].isRevealed = true;
                    }
                }
            }
        }

        function initGame() {
            gameOver = false;
            minesLeft = MINE_COUNT;
            document.getElementById('mines-count').textContent = toFarsiNumber(minesLeft);
            
            const boardElement = document.getElementById('board');
            boardElement.style.gridTemplateColumns = `repeat(${BOARD_WIDTH}, 35px)`;
            boardElement.style.width = 'fit-content';
            
            createBoard();
            renderBoard();
        }

        document.getElementById('reset').addEventListener('click', initGame);
        initializeGameSelection();
        initGame();

        // Add this function to handle going back to selection screen
        function goBackToSelection() {
            const gameSelection = document.getElementById('game-selection');
            const controls = document.getElementById('controls');
            const gameContainer = document.getElementById('game-container');
            
            gameSelection.classList.remove('hide');
            controls.classList.remove('show');
            gameContainer.classList.remove('show');
        }

        // Add this to your existing JavaScript
        document.getElementById('back-button').addEventListener('click', goBackToSelection);
    </script>
</body>
</html>
